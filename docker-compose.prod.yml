# Production overlay for docker compose.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Requires a real .env with secrets. Do not use local console-email / open-admin defaults.

# Container hardening: an attacker who gets code execution cannot change the image,
# gain privileges, or keep files anywhere except tmpfs and the media volume.
x-hardened-app: &hardened_app
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    # Request bodies over FILE_UPLOAD_MAX_MEMORY_SIZE (5 MB) are buffered here.
    - /tmp:size=512m,mode=1777

services:
  migrate:
    <<: *hardened_app

  postgres:
    # The image entrypoint needs root capabilities to drop to the postgres user.
    security_opt: ["no-new-privileges:true"]

  frontend:
    read_only: true
    cap_drop: [ALL]
    # nginx starts as root to bind port 80, then switches to the nginx user.
    cap_add: [CHOWN, NET_BIND_SERVICE, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

  web:
    <<: *hardened_app
    environment: &production_environment
      DEPLOYMENT_PROFILE: production
      DEBUG: "False"
      E2E_STRIPE_SIMULATE: "False"
      # Missing scanner leaves package uploads blocked; the web service can boot.
      PACKAGE_SCAN_HOST: ${PACKAGE_SCAN_HOST:-}
      PACKAGE_SCAN_PORT: ${PACKAGE_SCAN_PORT:-3310}
      ALLOW_LOCALHOST_FRONTEND: "False"
      ALLOW_CONSOLE_EMAIL: "False"
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      DJANGO_ADMIN_ENABLED: ${DJANGO_ADMIN_ENABLED:-False}
      SECURE_SSL_REDIRECT: "True"
      SECURE_HSTS_SECONDS: "31536000"
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set CSRF_TRUSTED_ORIGINS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?Set FRONTEND_BASE_URL}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:?Set PUBLIC_API_BASE_URL}

  worker:
    <<: *hardened_app
    environment:
      <<: *production_environment
      SKIP_STARTUP_MIGRATE: "True"
