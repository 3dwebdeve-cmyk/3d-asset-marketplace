name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketplace_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d marketplace_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Write test env
        run: |
          printf '%s\n' \
            'SECRET_KEY=ci-test-secret-key-at-least-32-bytes-long!!' \
            'DEBUG=True' \
            'DB_NAME=marketplace_db' \
            'DB_USER=postgres' \
            'DB_PASSWORD=postgres' \
            'DB_HOST=localhost' \
            'DB_PORT=5432' > .env
      - name: OpenAPI schema check
        run: python manage.py spectacular --file /tmp/openapi.yml
      - name: Run tests
        run: python manage.py test --verbosity=1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Write Compose env (no real secrets)
        run: |
          printf '%s\n' \
            'SECRET_KEY=ci-e2e-secret-key-at-least-32-bytes-long!!' \
            'DEBUG=False' \
            'ALLOWED_HOSTS=localhost,127.0.0.1,web,frontend' \
            'FRONTEND_BASE_URL=http://localhost:8080' \
            'ALLOW_LOCALHOST_FRONTEND=True' \
            'CORS_ALLOWED_ORIGINS=http://localhost:8080,http://127.0.0.1:8080' \
            'PUBLIC_API_BASE_URL=http://localhost:8080' \
            'SECURE_SSL_REDIRECT=False' \
            'JWT_REFRESH_COOKIE_SECURE=False' \
            'CSRF_TRUSTED_ORIGINS=http://localhost:8080,http://127.0.0.1:8080' \
            'DB_NAME=marketplace' \
            'DB_USER=marketplace' \
            'DB_PASSWORD=ci-e2e-db-password' \
            'DB_HOST=postgres' \
            'DB_PORT=5432' \
            'FRONTEND_PORT=8080' \
            'VITE_API_BASE_URL=' \
            'ALLOW_CONSOLE_EMAIL=True' \
            'EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend' \
            'DEFAULT_FROM_EMAIL=noreply@3dassetmarketplace.local' \
            'STRIPE_SECRET_KEY=sk_test_e2e_ci_placeholder_not_a_real_secret' \
            'STRIPE_PUBLISHABLE_KEY=pk_test_e2e_ci_placeholder' \
            'STRIPE_WEBHOOK_SECRET=whsec_e2e_ci_placeholder' \
            'E2E_STRIPE_SIMULATE=True' \
            'SENTRY_DSN=' > .env

      - name: Build and start Compose stack
        run: |
          set -o pipefail
          if ! docker compose \
            -f docker-compose.yml \
            -f docker-compose.e2e.yml \
            up --build -d; then
            echo "Compose startup failed"
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.e2e.yml \
              ps -a
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.e2e.yml \
              logs --no-color --tail=300 web
            exit 1
          fi

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:8080/api/v1/healthz/" >/dev/null; then
              echo "stack healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Compose stack failed to become healthy"
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml ps -a
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color --tail=300 web
          exit 1

      - name: Seed E2E commerce fixtures
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml exec -T web \
            python manage.py seed_e2e_commerce

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run browser E2E
        working-directory: e2e
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:8080
          E2E_BUYER_EMAIL: e2e-buyer@example.com
          E2E_BUYER_PASSWORD: E2eBuyerPass123!
          E2E_PRODUCT_SLUG: e2e-checkout-chair
          E2E_ADMIN_EMAIL: e2e-admin@example.com
          E2E_ADMIN_PASSWORD: E2eAdminPass123!
          E2E_PLUGIN_SLUG: e2e-checkout-plugin
          E2E_UNVERIFIED_EMAIL: e2e-unverified@example.com
          E2E_UNVERIFIED_PASSWORD: E2eUnverifiedPass123!
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      - name: Dump Compose logs on failure
        if: failure()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.e2e.yml \
            ps -a
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.e2e.yml \
            logs --no-color --tail=300 web

      - name: Tear down Compose
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
