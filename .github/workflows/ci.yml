name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketplace_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d marketplace_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Python dependency security audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - name: Static security scan (bandit)
        # Fails on medium or high findings, and also when any file could not be
        # scanned: bandit exits 0 after skipping files it fails to parse.
        run: |
          pip install bandit==1.9.4
          bandit -r . -x ./.venv,./media,./staticfiles --severity-level medium -q -f json -o /tmp/bandit.json || true
          python - <<'EOF'
          import json, sys
          report = json.load(open("/tmp/bandit.json"))
          for error in report["errors"]:
              print(f"bandit could not scan {error['filename']}: {error['reason']}")
          for issue in report["results"]:
              print(f"{issue['filename']}:{issue['line_number']} {issue['test_id']} "
                    f"{issue['issue_severity']} {issue['issue_text']}")
          print(f"bandit scanned {report['metrics']['_totals']['loc']} lines")
          sys.exit(1 if report["errors"] or report["results"] else 0)
          EOF
      - name: Write test env
        run: |
          printf '%s\n' \
            'SECRET_KEY=ci-test-secret-key-at-least-32-bytes-long!!' \
            'DEBUG=True' \
            'DB_NAME=marketplace_db' \
            'DB_USER=postgres' \
            'DB_PASSWORD=postgres' \
            'DB_HOST=localhost' \
            'DB_PORT=5432' > .env
      - name: OpenAPI schema check
        run: python manage.py spectacular --validate --file /tmp/openapi.yml
      - name: Strict migration and Django checks
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py check
      - name: Run tests
        run: python manage.py test --verbosity=1
      - name: Verify restricted runtime database role on disposable CI database
        env:
          DB_NAME: marketplace_db
          DB_HOST: localhost
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_MIGRATION_USER: postgres
          DB_MIGRATION_PASSWORD: postgres
          DB_RUNTIME_USER: ci_runtime
          DB_RUNTIME_PASSWORD: ci-runtime-password-strong
          ADMIN_CONSOLE_ALLOWED_IPS: 127.0.0.1/32
          DJANGO_ADMIN_ALLOWED_IPS: 127.0.0.1/32
          FRONTEND_BASE_URL: https://ci.example.invalid
          ALLOW_CONSOLE_EMAIL: "True"
        run: |
          python manage.py migrate --noinput
          python scripts/provision_runtime_role.py
          DB_USER=ci_runtime DB_PASSWORD="$DB_RUNTIME_PASSWORD" \
            DEPLOYMENT_PROFILE=staging DEBUG=False \
            python manage.py check_db_runtime_role

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: JavaScript dependency security audit
        run: npm audit --audit-level=moderate
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Write Compose env (no real secrets)
        run: |
          printf '%s\n' \
            'SECRET_KEY=ci-e2e-secret-key-at-least-32-bytes-long!!' \
            'DEBUG=False' \
            'ALLOWED_HOSTS=localhost,127.0.0.1,web,frontend' \
            'FRONTEND_BASE_URL=http://localhost:8080' \
            'ALLOW_LOCALHOST_FRONTEND=True' \
            'CORS_ALLOWED_ORIGINS=http://localhost:8080,http://127.0.0.1:8080' \
            'PUBLIC_API_BASE_URL=http://localhost:8080' \
            'SECURE_SSL_REDIRECT=False' \
            'JWT_REFRESH_COOKIE_SECURE=False' \
            'CSRF_TRUSTED_ORIGINS=http://localhost:8080,http://127.0.0.1:8080' \
            'DB_NAME=marketplace' \
            'DB_USER=marketplace' \
            'DB_PASSWORD=ci-e2e-db-password' \
            'DB_HOST=postgres' \
            'DB_PORT=5432' \
            'FRONTEND_PORT=8080' \
            'VITE_API_BASE_URL=' \
            'ALLOW_CONSOLE_EMAIL=True' \
            'EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend' \
            'DEFAULT_FROM_EMAIL=noreply@3dassetmarketplace.local' \
            'STRIPE_SECRET_KEY=sk_test_e2e_ci_placeholder_not_a_real_secret' \
            'STRIPE_PUBLISHABLE_KEY=pk_test_e2e_ci_placeholder' \
            'STRIPE_WEBHOOK_SECRET=whsec_e2e_ci_placeholder' \
            'E2E_STRIPE_SIMULATE=True' \
            'SENTRY_DSN=' > .env

      - name: Build and start Compose stack
        run: |
          set -o pipefail
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml config --quiet
          if ! docker compose \
            -f docker-compose.yml \
            -f docker-compose.e2e.yml \
            up --build -d; then
            echo "Compose startup failed"
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.e2e.yml \
              ps -a
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.e2e.yml \
              logs --no-color --tail=300 web
            exit 1
          fi

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:8080/api/v1/healthz/" >/dev/null; then
              echo "stack healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Compose stack failed to become healthy"
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml ps -a
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color --tail=300 web
          exit 1

      - name: Verify actual outbox worker and release migration
        run: |
          for i in $(seq 1 12); do
            if docker compose -f docker-compose.yml -f docker-compose.e2e.yml exec -T worker \
              python manage.py check_background_jobs; then
              break
            fi
            if [ "$i" -eq 12 ]; then
              echo "Outbox worker never reported a live heartbeat"
              docker compose -f docker-compose.yml -f docker-compose.e2e.yml ps -a
              docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color --tail=200 worker
              exit 1
            fi
            sleep 5
          done
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml exec -T web \
            python manage.py migrate --check

      - name: Seed E2E commerce fixtures
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml exec -T web \
            python manage.py seed_e2e_commerce

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run browser E2E
        working-directory: e2e
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:8080
          E2E_BUYER_EMAIL: e2e-buyer@example.com
          E2E_BUYER_PASSWORD: E2eBuyerPass123!
          E2E_PRODUCT_SLUG: e2e-checkout-chair
          E2E_ADMIN_EMAIL: e2e-admin@example.com
          E2E_ADMIN_PASSWORD: E2eAdminPass123!
          E2E_PLUGIN_SLUG: e2e-checkout-plugin
          E2E_UNVERIFIED_EMAIL: e2e-unverified@example.com
          E2E_UNVERIFIED_PASSWORD: E2eUnverifiedPass123!
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      - name: Dump Compose logs on failure
        if: failure()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.e2e.yml \
            ps -a
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.e2e.yml \
            logs --no-color --tail=300 web

      - name: Tear down Compose
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
