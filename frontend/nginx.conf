# Prefer edge-provided proto (Cloudflare / LB TLS) over the container $scheme (often http).
geo $realip_remote_addr $trusted_tls_peer {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}
map "$trusted_tls_peer:$http_x_forwarded_proto" $forwarded_proto {
    default $scheme;
    "1:https" https;
    "1:http" http;
}

# Resolve the visitor IP from CF-Connecting-IP ONLY when the TCP peer is Cloudflare.
# Direct-to-origin requests keep their real peer address, so a spoofed header is ignored.
# Local Compose (no Cloudflare in front) keeps $remote_addr as the direct peer.
# Keep in sync with https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Edge rate limits keyed by the resolved visitor IP (first layer before DRF throttles).
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers for the SPA host (API emits its own CSP).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Same value Django sends on API responses. Browsers ignore it over plain http (local).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Defense-in-depth against XSS (complements httpOnly refresh cookies).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' blob: https://accounts.google.com https://*.googleapis.com https://*.sentry.io https://*.ingest.sentry.io https://pub-a20fb6d206fc47a1b1e5e247e82838e0.r2.dev https://0d3f756f61c3239ec77f9941c82c20c3.r2.cloudflarestorage.com; worker-src 'self' blob:; frame-src https://accounts.google.com https://lottie.host; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri /api/v1/security/csp-report/" always;

    # Django reads the client IP only from X-Real-IP / X-Forwarded-For set here;
    # the raw CF-Connecting-IP header is stripped so it can never be trusted upstream.

    # Credential / email-sending endpoints — strict edge limit.
    location ~ ^/api/v1/auth/(login|google|admin/login|admin/mfa/setup|admin/mfa/confirm|admin/mfa/verify|register|password-reset|password-reset/confirm|email-verification/resend|email-verification/confirm|token/refresh)/$ {
        limit_req zone=auth burst=20 nodelay;
        client_max_body_size 1m;
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP "";
    }

    # Avatar upload (backend caps files at 2 MB; headroom for multipart framing).
    location = /api/v1/auth/profile/avatar/ {
        limit_req zone=api burst=40 nodelay;
        client_max_body_size 3m;
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP "";
    }

    # Admin console APIs — only place large product / plugin uploads are accepted.
    location /api/v1/admin/ {
        limit_req zone=api burst=40 nodelay;
        client_max_body_size 52m;
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP "";
        proxy_read_timeout 120s;
    }

    # Django API (Gunicorn) — same-origin for the browser when VITE_API_BASE_URL is empty.
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        client_max_body_size 1m;
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP "";
        proxy_read_timeout 120s;
    }

    # Django admin login has no DRF throttle — strict edge limit.
    location = /admin/login/ {
        limit_req zone=auth burst=20 nodelay;
        client_max_body_size 1m;
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP "";
    }

    # Django admin ONLY (SPA control panel lives at /console/* via location /).
    # ^~ stops nginx from letting the image regex below take admin asset requests.
    location ^~ /admin/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP "";
    }

    # ^~ keeps Django admin icons (.svg/.png) on this proxy instead of the image regex.
    location ^~ /static/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Hashed Vite assets — long cache.
    # Cache optimized public artwork across client-side navigation.
    location ~* \.(?:avif|webp|png|jpe?g|svg)$ {
        try_files $uri =404;
        access_log off;
        # No add_header here: one would drop the server-level security headers.
        # expires already sets Cache-Control max-age.
        expires 30d;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        # No add_header here, so CSP and nosniff still apply to these responses.
        expires 1y;
    }

    # SPA fallback (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
