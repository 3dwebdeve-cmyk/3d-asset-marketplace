# Prefer edge-provided proto (Cloudflare / LB TLS) over the container $scheme (often http).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Resolve the visitor IP from CF-Connecting-IP ONLY when the TCP peer is Cloudflare.
# Direct-to-origin requests keep their real peer address, so a spoofed header is ignored.
# Local Compose (no Cloudflare in front) keeps $remote_addr as the direct peer.
# Keep in sync with https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Edge rate limits keyed by the resolved visitor IP (first layer before DRF throttles).
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers for the SPA host (API emits its own CSP).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Defense-in-depth against XSS (complements httpOnly refresh cookies).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' blob: data: https://accounts.google.com https://*.googleapis.com https://*.sentry.io https://*.ingest.sentry.io https://*.r2.dev https://*.cloudflarestorage.com; worker-src 'self' blob:; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Django reads the client IP only from X-Real-IP / X-Forwarded-For set here;
    # the raw CF-Connecting-IP header is stripped so it can never be trusted upstream.

    # Credential / email-sending endpoints — strict edge limit.
    location ~ ^/api/v1/auth/(login|google|admin/login|register|password-reset|password-reset/confirm|email-verification/resend|email-verification/confirm|token/refresh)/$ {
        limit_req zone=auth burst=20 nodelay;
        client_max_body_size 1m;
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP "";
    }

    # Avatar upload (backend caps files at 2 MB; headroom for multipart framing).
    location = /api/v1/auth/profile/avatar/ {
        limit_req zone=api burst=40 nodelay;
        client_max_body_size 3m;
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP "";
    }

    # Admin console APIs — only place large product / plugin uploads are accepted.
    location /api/v1/admin/ {
        limit_req zone=api burst=40 nodelay;
        client_max_body_size 52m;
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP "";
        proxy_read_timeout 120s;
    }

    # Django API (Gunicorn) — same-origin for the browser when VITE_API_BASE_URL is empty.
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        client_max_body_size 1m;
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP "";
        proxy_read_timeout 120s;
    }

    # Django admin login has no DRF throttle — strict edge limit.
    location = /admin/login/ {
        limit_req zone=auth burst=20 nodelay;
        client_max_body_size 1m;
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP "";
    }

    # Django admin ONLY (SPA control panel lives at /console/* via location /).
    location /admin/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP "";
    }

    location /static/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Hashed Vite assets — long cache.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
